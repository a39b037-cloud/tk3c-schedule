<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3C 賣場智慧排班系統 - V20</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --table-header: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --log-panel: #1e1e1e;
            --weekend-bg: #ffe0e9; 
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 15px; background: var(--primary-bg); font-size: 13px; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 15px; }
        .editor-box { background: #fff3cd; padding: 10px 20px; border-radius: 50px; border: 2px solid #ffeeba; display: flex; align-items: center; gap: 10px; }
        .editor-box.active { background: #d4edda; border-color: #c3e6cb; }
        #editorId { border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; width: 80px; }

        .config-panel { display: flex; gap: 15px; margin-bottom: 15px; padding: 15px; background: #e8f4fd; border-radius: 8px; border-left: 5px solid var(--accent); align-items: center; flex-wrap: wrap; }
        .config-group { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .config-group input { width: 45px; text-align: center; }

        .table-wrapper { overflow-x: auto; max-height: 600px; border: 1px solid #dee2e6; position: relative; }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; display: none; }
        .locked .lock-overlay { display: block; }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th { background: var(--table-header); color: white; padding: 8px; position: sticky; top: 0; z-index: 25; border: 1px solid #444; }
        
        /* 左側欄位固定 */
        th:nth-child(-n+8), td:nth-child(-n+8) { position: sticky; z-index: 15; background: #fff; }
        th:nth-child(-n+8) { z-index: 26; background: var(--table-header); }
        th:nth-child(1), td:nth-child(1) { left: 0; }
        th:nth-child(2), td:nth-child(2) { left: 50px; }
        th:nth-child(3), td:nth-child(3) { left: 115px; }
        th:nth-child(4), td:nth-child(4) { left: 185px; }
        th:nth-child(5), td:nth-child(5) { left: 245px; }
        th:nth-child(6), td:nth-child(6) { left: 345px; }
        th:nth-child(7), td:nth-child(7) { left: 455px; }
        th:nth-child(8), td:nth-child(8) { left: 515px; border-right: 2px solid #666; }

        td { border: 1px solid #dee2e6; padding: 4px; text-align: center; }
        .weekend-col { background-color: var(--weekend-bg) !important; color: #c2185b; font-weight: bold; }

        /* --- 修正：無縫隙底部固定統計欄位 --- */
        .summary-row { background: #eceff1; font-weight: bold; position: sticky; z-index: 30; }
        /* 正職人力位置調整，確保與全店人力無縫連接 */
        .summary-pro { bottom: 27px; border-top: 1px solid #999; } 
        .summary-full { bottom: 0px; border-top: 1px solid #999; } 

        .pro-staff { color: #c0392b; background-color: #fdeaea !important; } 
        .full-staff { color: #2980b9; background-color: #e8f4fd !important; }
        
        .warn-text { color: var(--danger); font-weight: bold; text-decoration: underline; }
        .status-L, .status-H, .status-N, .status-S { color: red !important; font-weight: bold; }
        .status-D { background-color: #fff9c4 !important; font-weight: bold; border: 1px solid #fbc02d; }
        .status-C { color: #7f8c8d; font-style: italic; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .log-section { margin-top: 20px; background: var(--log-panel); color: #81c784; padding: 12px; border-radius: 8px; height: 100px; overflow-y: auto; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>🛒 3C 賣場智慧排班系統 V20</h2>
        <div class="editor-box" id="editorBox">
            <span>✍️ 薪號：</span>
            <input type="text" id="editorId" placeholder="必填" oninput="toggleLock()">
            <span id="lockStatus" style="color:var(--danger)">請輸入薪號解鎖</span>
        </div>
    </div>

    <div class="config-panel">
        <div class="config-group">例假 <input type="number" id="ruleL" value="4" onchange="updateSummary()"></div>
        <div class="config-group">休假 <input type="number" id="ruleH" value="4" onchange="updateSummary()"></div>
        <div class="config-group">國定假 <input type="number" id="ruleN" value="1" onchange="updateSummary()"></div>
        <label>起始日：<input type="date" id="startDate" value="2026-02-01" onchange="initTable()"></label>
        <button class="btn" style="background:#4caf50;color:white" onclick="addRow()">+ 新增人員</button>
        <button class="btn" style="background:#f39c12;color:white" onclick="saveToLocal()">💾 儲存</button>
        <button class="btn" style="background:#27ae60;color:white" onclick="exportToExcel()">📊 輸出 Excel</button>
    </div>

    <div class="table-wrapper locked" id="tableWrapper">
        <div class="lock-overlay" onclick="promptForEditorId()"></div>
        <table id="mainTable">
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="memberList"></tbody>
            <tfoot id="statFoot"></tfoot>
        </table>
    </div>
    <div class="log-section" id="logList">系統就緒。</div>
</div>

<script>
const titles = ["店經理", "服務專員", "收銀-晚P", "TV股副理", "生活家電副理", "APPLE專員", "系統股副理", "電氣醫生", "(13:30-21:30)", "(13:00-21:00)", "(12:30-21:30)"];
const categories = ["", "2C", "APPLE", "1C", "國際", "LG", "SONY", "三星"];
const defaultMembers = [
    { name: "謝易辰", id: "022403", phone: "0920-520765", cat: "", title: "店經理", type: "正職" },
    { name: "曾怡婷", id: "026273", phone: "0921-486815", cat: "", title: "服務專員", type: "正職" },
    { name: "黃湘庭", id: "293631", phone: "0909-570985", cat: "", title: "收銀-晚P", type: "PT" },
    { name: "張妙雀", id: "006384", phone: "0928-194882", cat: "2C", title: "TV股副理", type: "正職" },
    { name: "許申霖", id: "005480", phone: "0932-371433", cat: "2C", title: "生活家電副理", type: "正職" },
    { name: "許威毅", id: "031464", phone: "0920-100592", cat: "2C", title: "服務專員", type: "正職" },
    { name: "楊鎧蔚", id: "031469", phone: "0968-666358", cat: "2C", title: "服務專員", type: "正職" },
    { name: "黃冠儒", id: "031565", phone: "0932-211597", cat: "2C", title: "服務專員", type: "正職" },
    { name: "江景詮", id: "014133", phone: "0937-719740", cat: "APPLE", title: "APPLE專員", type: "正職" },
    { name: "許明敬", id: "029245", phone: "0912-036638", cat: "1C", title: "系統股副理", type: "正職" },
    { name: "王晟峻", id: "030176", phone: "0988-612549", cat: "1C", title: "服務專員", type: "正職" },
    { name: "林德華", id: "025219", phone: "0988-188187", cat: "1C", title: "電器醫生", type: "正職" },
    { name: "蔡文瑜", id: "612079", phone: "0926-854700", cat: "國際", title: "(13:30-21:30)", type: "駐場" },
    { name: "張楷杰", id: "", phone: "0982-198489", cat: "LG", title: "(13:00-21:00)", type: "駐場" },
    { name: "梁哲瑋", id: "624948", phone: "0970-911062", cat: "SONY", title: "(12:30-21:30)", type: "駐場" },
    { name: "陳政毅", id: "", phone: "0911-431039", cat: "三星", title: "(12:30-21:30)", type: "駐場" }
];

function promptForEditorId() {
    const eid = prompt("⚠️ 請輸入薪號：");
    if (eid) { document.getElementById('editorId').value = eid; toggleLock(); }
}

function toggleLock() {
    const eid = document.getElementById('editorId').value.trim();
    const active = eid.length > 0;
    document.getElementById('tableWrapper').classList.toggle('locked', !active);
    document.getElementById('editorBox').classList.toggle('active', active);
}

function initTable() {
    const start = new Date(document.getElementById('startDate').value);
    let header = `<th>操作</th><th>類別</th><th>姓名</th><th>薪號</th><th>電話</th><th>職稱</th><th>身份</th><th>統計</th>`;
    for(let i=0; i<28; i++){
        const d = new Date(start); d.setDate(start.getDate() + i);
        header += `<th class="${d.getDay()===0||d.getDay()===6?'weekend-col':''}">${d.getMonth()+1}/${d.getDate()}<br>${['日','一','二','三','四','五','六'][d.getDay()]}</th>`;
    }
    document.getElementById('dateHeader').innerHTML = header;
    document.getElementById('memberList').innerHTML = "";
    const saved = localStorage.getItem('shiftData');
    (saved ? JSON.parse(saved) : defaultMembers).forEach(m => addRow(m));
    updateSummary();
}

function addRow(pre = null) {
    const tr = document.createElement('tr');
    let catOpt = categories.map(c => `<option value="${c}" ${pre?.cat===c?'selected':''}>${c||'--'}</option>`).join('');
    let titleOpt = titles.map(t => `<option value="${t}" ${pre?.title===t?'selected':''}>${t}</option>`).join('');
    let html = `<td><button class="btn" style="background:#e74c3c;color:white;padding:2px 5px" onclick="confirmDelete(this)">刪除</button></td>
        <td><select class="m-cat">${catOpt}</select></td>
        <td><input type="text" class="m-name" value="${pre?.name||''}" style="width:60px"></td>
        <td><input type="text" class="m-id" value="${pre?.id||''}" style="width:50px"></td>
        <td><input type="text" class="m-phone" value="${pre?.phone||''}" style="width:90px"></td>
        <td><select class="m-title">${titleOpt}</select></td>
        <td><select class="m-type" onchange="updateSummary()"><option value="正職" ${pre?.type==='正職'?'selected':''}>正職</option><option value="PT" ${pre?.type==='PT'?'selected':''}>PT</option><option value="駐場" ${pre?.type==='駐場'?'selected':''}>駐場</option></select></td>
        <td class="m-stat">--</td>`;
    for(let i=0; i<28; i++) {
        const v = pre?.days?.[i] || 'W';
        html += `<td><select class="d-status status-${v}" onchange="changeStatus(this, ${i})">
            <option value="W" ${v==='W'?'selected':''}>上班</option><option value="L" ${v==='L'?'selected':''}>例假</option>
            <option value="H" ${v==='H'?'selected':''}>休假</option><option value="N" ${v==='N'?'selected':''}>國定</option>
            <option value="S" ${v==='S'?'selected':''}>特休</option><option value="D" ${v==='D'?'selected':''}>值星</option>
            <option value="C" ${v==='C'?'selected':''}>上課</option></select></td>`;
    }
    tr.innerHTML = html;
    document.getElementById('memberList').appendChild(tr);
}

function confirmDelete(btn) {
    if (confirm("確定刪除此人員？")) { btn.closest('tr').remove(); updateSummary(); }
}

function changeStatus(el, dayIdx) {
    const row = el.closest('tr');
    const name = row.querySelector('.m-name').value || "未命名";
    const type = row.querySelector('.m-type').value;
    const newValue = el.value;
    const allCells = Array.from(row.querySelectorAll('.d-status'));
    const rL = parseInt(document.getElementById('ruleL').value) || 0, rH = parseInt(document.getElementById('ruleH').value) || 0, rN = parseInt(document.getElementById('ruleN').value) || 0;
    
    if (type === '正職' && ['L', 'H', 'N'].includes(newValue)) {
        let temp = allCells.map(s => s.value); temp[dayIdx] = newValue;
        if (temp.filter(v => ['L', 'H', 'N'].includes(v)).length > (rL+rH+rN)) {
            if (!confirm(`⚠️ ${name} 排假已超標。確認排入？`)) { el.value = 'W'; }
        }
    }
    if (type === '正職' && newValue === 'L') {
        const biStart = dayIdx < 14 ? 0 : 14;
        let temp = allCells.map(s => s.value); temp[dayIdx] = 'L';
        if (temp.slice(biStart, biStart+14).filter(v => v === 'L').length > 2) {
            if (!confirm(`⚠️ ${name} 雙週例假已滿。確認排入？`)) { el.value = 'W'; }
        }
    }
    el.className = 'd-status status-' + el.value;
    document.getElementById('logList').insertAdjacentHTML('afterbegin', `<div>[${new Date().toLocaleTimeString()}] ${document.getElementById('editorId').value} 修改 ${name} 第 ${dayIdx+1} 天為 ${el.options[el.selectedIndex].text}</div>`);
    updateSummary();
}

function updateSummary() {
    const rows = document.querySelectorAll('#memberList tr');
    const rL = parseInt(document.getElementById('ruleL').value), rH = parseInt(document.getElementById('ruleH').value), rN = parseInt(document.getElementById('ruleN').value);
    let proS = new Array(28).fill(0), fullS = new Array(28).fill(0);
    rows.forEach(r => {
        let l=0, h=0, n=0, s=0, type = r.querySelector('.m-type').value;
        r.querySelectorAll('.d-status').forEach((sel, i) => {
            const v = sel.value;
            if(v==='L') l++; if(v==='H') h++; if(v==='N') n++; if(v==='S') s++;
            if(['W','D'].includes(v)) { fullS[i]++; if(type==='正職') proS[i]++; }
        });
        const check = (v, rule) => (type==='正職' && v < rule) ? `<span class="warn-text">${v}</span>` : v;
        r.querySelector('.m-stat').innerHTML = `例:${check(l,rL)} 休:${check(h,rH)}<br>國:${check(n,rN)} 特:${s}`;
    });
    let foot = `<tr class="summary-row summary-pro"><td colspan="8" class="pro-staff">正職人力</td>`;
    proS.forEach(n => foot += `<td class="pro-staff">${n}</td>`);
    foot += `</tr><tr class="summary-row summary-full"><td colspan="8" class="full-staff">全店人力</td>`;
    fullS.forEach(n => foot += `<td class="full-staff">${n}</td>`);
    document.getElementById('statFoot').innerHTML = foot;
}

function saveToLocal() {
    const data = Array.from(document.querySelectorAll('#memberList tr')).map(tr => ({
        cat: tr.querySelector('.m-cat').value, name: tr.querySelector('.m-name').value, id: tr.querySelector('.m-id').value, phone: tr.querySelector('.m-phone').value,
        title: tr.querySelector('.m-title').value, type: tr.querySelector('.m-type').value, days: Array.from(tr.querySelectorAll('.d-status')).map(s => s.value)
    }));
    localStorage.setItem('shiftData', JSON.stringify(data)); alert("儲存成功！");
}

function exportToExcel() {
    const editor = document.getElementById('editorId').value;
    if (!editor) {
        alert("請先輸入薪號以確認匯出權限");
        return;
    }

    const startDate = document.getElementById('startDate').value;
    const originalTable = document.getElementById('mainTable');
    const tableClone = originalTable.cloneNode(true);
    
    // 1. 移除操作欄（第一欄）
    tableClone.querySelectorAll('tr').forEach(row => {
        row.deleteCell(0);
    });

    // 2. 修正統計列錯位：將原本合併的 8 格拆開，改為插入 7 個空白格
    const tfootRows = tableClone.querySelectorAll('tfoot tr');
    tfootRows.forEach(row => {
        // 移除原本合併 8 格的標題儲存格
        const titleCell = row.querySelector('td[colspan="8"]');
        if (titleCell) {
            const titleText = titleCell.innerText;
            titleCell.remove(); // 移除舊的合併格

            // 插入 7 個空白格（向右移動七格）
            for (let i = 0; i < 6; i++) {
                row.insertCell(0).innerText = "";
            }
            // 第 7 格填入標題名稱（如：正職人力）
            row.insertCell(6).innerText = titleText;
        }
    });

    // 3. 轉換 Body 內容 (Input/Select 轉為文字)
    const tbodyRows = tableClone.querySelectorAll('tbody tr');
    const originalRows = originalTable.querySelectorAll('tbody tr');
    tbodyRows.forEach((row, rIdx) => {
        const orig = originalRows[rIdx];
        row.querySelectorAll('input').forEach(inp => inp.parentElement.innerText = inp.value);
        const origSels = orig.querySelectorAll('select');
        row.querySelectorAll('select').forEach((sel, sIdx) => {
            sel.parentElement.innerText = origSels[sIdx].options[origSels[sIdx].selectedIndex].text;
        });
    });

    // 使用 SheetJS 匯出
    const wb = XLSX.utils.table_to_book(tableClone, { sheet: "排班表" });
    XLSX.writeFile(wb, `3C賣場班表_${startDate}.xlsx`);
    
    // 紀錄履歷
    document.getElementById('logList').insertAdjacentHTML('afterbegin', 
        `<div>[${new Date().toLocaleTimeString()}] ${editor} 匯出了對齊版的 Excel</div>`);
}
window.onload = initTable;
</script>
</body>
</html>
