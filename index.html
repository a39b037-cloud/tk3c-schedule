<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3C 賣場智慧排班系統 V28</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --table-header: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --log-panel: #1e1e1e;
            --weekend-bg: #ffe0e9; 
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 10px; background: var(--primary-bg); font-size: 13px; }
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .editor-box { background: #fff3cd; padding: 8px 15px; border-radius: 50px; border: 2px solid #ffeeba; display: flex; align-items: center; gap: 8px; }
        .editor-box.active { background: #d4edda; border-color: #c3e6cb; }
        #editorId { border: 1px solid #ccc; padding: 5px; border-radius: 4px; width: 70px; }

        .config-panel { display: flex; gap: 8px; margin-bottom: 15px; padding: 12px; background: #e8f4fd; border-radius: 8px; align-items: center; flex-wrap: wrap; }
        .config-group { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .config-group input { width: 35px; text-align: center; }

        .table-wrapper { overflow-x: auto; max-height: 500px; border: 1px solid #dee2e6; position: relative; -webkit-overflow-scrolling: touch; }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; display: none; }
        .locked .lock-overlay { display: block; }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th { background: var(--table-header); color: white; padding: 10px 5px; position: sticky; top: 0; z-index: 25; border: 1px solid #444; }
        
        th:nth-child(-n+8), td:nth-child(-n+8) { position: sticky; z-index: 15; background: #fff; }
        th:nth-child(-n+8) { z-index: 26; background: var(--table-header); }
        
        th:nth-child(1), td:nth-child(1) { left: 0; min-width: 40px; }   /* 勾選 */
        th:nth-child(2), td:nth-child(2) { left: 40px; min-width: 55px; }  
        th:nth-child(3), td:nth-child(3) { left: 95px; min-width: 60px; } 
        th:nth-child(4), td:nth-child(4) { left: 155px; min-width: 55px; } 
        th:nth-child(5), td:nth-child(5) { left: 210px; min-width: 85px; } 
        th:nth-child(6), td:nth-child(6) { left: 295px; min-width: 85px; } 
        th:nth-child(7), td:nth-child(7) { left: 380px; min-width: 55px; } 
        th:nth-child(8), td:nth-child(8) { left: 435px; min-width: 65px; border-right: 2px solid #666; } 

        td { border: 1px solid #dee2e6; padding: 6px 4px; text-align: center; }
        .weekend-col { background-color: var(--weekend-bg) !important; color: #c2185b; font-weight: bold; }

        .summary-row { background: #eceff1; font-weight: bold; position: sticky; z-index: 30; }
        .summary-pro { bottom: 31px; border-top: 1px solid #999; height: 31px; } 
        .summary-full { bottom: 0px; border-top: 1px solid #999; height: 31px; } 
        .pro-staff { color: #c0392b; background-color: #fdeaea !important; } 
        .full-staff { color: #2980b9; background-color: #e8f4fd !important; }
        
        .status-L, .status-H, .status-N, .status-S, .status-C { color: red !important; font-weight: bold; }
        .status-D { background-color: #fff9c4 !important; font-weight: bold; border: 1px solid #fbc02d; }
        
        select { border: 1px solid #ccc; border-radius: 4px; padding: 4px 2px; font-size: 13px; height: 28px; }
        .btn { padding: 8px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

        @media screen and (max-width: 600px) {
            th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2), th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6), th:nth-child(7), td:nth-child(7) { display: none !important; }
            th:nth-child(3), td:nth-child(3) { left: 0 !important; min-width: 60px; }
            th:nth-child(8), td:nth-child(8) { left: 60px !important; min-width: 65px; border-right: 2px solid #666; }
            .summary-row td:first-child { display: table-cell !important; left: 0 !important; width: 125px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>🛒 智慧排班系統 V28</h2>
        <div class="editor-box" id="editorBox">
            ✍️ 薪號：<input type="text" id="editorId" placeholder="必填" oninput="toggleLock()">
            <span id="lockStatus" style="color:var(--danger); font-size: 11px;">未解鎖</span>
        </div>
    </div>

    <div class="config-panel">
        <div class="config-group">例 <input type="number" id="ruleL" value="4"></div>
        <div class="config-group">休 <input type="number" id="ruleH" value="4"></div>
        <div class="config-group">國 <input type="number" id="ruleN" value="1"></div>
        <input type="date" id="startDate" value="2026-02-01" onchange="initTable()">
        <button class="btn" style="background:#8e44ad;color:white" onclick="autoDistributeHolidays()">✨ 批量分配</button>
        <button class="btn" style="background:#e74c3c;color:white" onclick="deleteSelectedRows()">🗑️ 刪除選中</button>
        <button class="btn" style="background:#e67e22;color:white" onclick="resetAllShifts()">🔄 重置假別</button>
        <button class="btn" style="background:#f39c12;color:white" onclick="saveToLocal()">💾 儲存</button>
        <button class="btn" style="background:#27ae60;color:white" onclick="exportToExcel()">📊 Excel</button>
    </div>

    <div class="table-wrapper locked" id="tableWrapper">
        <div class="lock-overlay" onclick="promptForEditorId()"></div>
        <table id="mainTable">
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="memberList"></tbody>
            <tfoot id="statFoot"></tfoot>
        </table>
    </div>

    <div class="log-section" style="margin-top: 20px; background: #1e1e1e; color: #81c784; padding: 12px; border-radius: 8px;">
        <div style="color: white; border-bottom: 1px solid #333; margin-bottom: 5px; font-weight: bold;">📜 操作履歷</div>
        <div id="logList" style="height: 100px; overflow-y: auto; font-size: 11px; font-family: monospace;">系統就緒...</div>
    </div>
</div>

<script>
const titles = ["店經理", "服務專員", "收銀-晚P", "TV股副理", "生活家電副理", "APPLE專員", "系統股副理", "電器醫生", "(13:30-21:30)", "(13:00-21:00)", "(12:30-21:30)"];
const categories = ["", "2C", "APPLE", "1C", "國際", "LG", "SONY", "三星"];
const defaultMembers = [
    { name: "謝易辰", id: "022403", phone: "0920-520765", cat: "", title: "店經理", type: "正職" },
    { name: "曾怡婷", id: "026273", phone: "0921-486815", cat: "", title: "服務專員", type: "正職" },
    { name: "黃湘庭", id: "293631", phone: "0909-570985", cat: "", title: "收銀-晚P", type: "PT" },
    { name: "張妙雀", id: "006384", phone: "0928-194882", cat: "2C", title: "TV股副理", type: "正職" },
    { name: "許申霖", id: "005480", phone: "0932-371433", cat: "2C", title: "生活家電副理", type: "正職" },
    { name: "許威毅", id: "031464", phone: "0920-100592", cat: "2C", title: "服務專員", type: "正職" },
    { name: "楊鎧蔚", id: "031469", phone: "0968-666358", cat: "2C", title: "服務專員", type: "正職" },
    { name: "黃冠儒", id: "031565", phone: "0932-211597", cat: "2C", title: "服務專員", type: "正職" },
    { name: "江景詮", id: "014133", phone: "0937-719740", cat: "APPLE", title: "APPLE專員", type: "正職" },
    { name: "許明敬", id: "029245", phone: "0912-036638", cat: "1C", title: "系統股副理", type: "正職" },
    { name: "王晟峻", id: "030176", phone: "0988-612549", cat: "1C", title: "服務專員", type: "正職" },
    { name: "林德華", id: "025219", phone: "0988-188187", cat: "1C", title: "電器醫生", type: "正職" },
    { name: "蔡文瑜", id: "612079", phone: "0926-854700", cat: "國際", title: "(13:30-21:30)", type: "駐場" },
    { name: "張楷杰", id: "", phone: "0982-198489", cat: "LG", title: "(13:00-21:00)", type: "駐場" },
    { name: "梁哲瑋", id: "624948", phone: "0970-911062", cat: "SONY", title: "(12:30-21:30)", type: "駐場" },
    { name: "陳政毅", id: "", phone: "0911-431039", cat: "三星", title: "(12:30-21:30)", type: "駐場" }
];

function promptForEditorId() {
    const eid = prompt("⚠️ 請輸入薪號解鎖編輯：");
    if (eid) { document.getElementById('editorId').value = eid; toggleLock(); }
}

function toggleLock() {
    const eid = document.getElementById('editorId').value.trim();
    const active = eid.length > 0;
    document.getElementById('tableWrapper').classList.toggle('locked', !active);
    document.getElementById('lockStatus').innerText = active ? "✅ 已解鎖" : "❌ 未輸入薪號";
    document.getElementById('editorBox').classList.toggle('active', active);
}

function initTable() {
    const start = new Date(document.getElementById('startDate').value);
    let header = `<th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th><th>類別</th><th>姓名</th><th>薪號</th><th>電話</th><th>職稱</th><th>身份</th><th>統計</th>`;
    for(let i=0; i<28; i++){
        const d = new Date(start); d.setDate(start.getDate() + i);
        header += `<th class="${d.getDay()===0||d.getDay()===6?'weekend-col':''}">${d.getMonth()+1}/${d.getDate()}<br>${['日','一','二','三','四','五','六'][d.getDay()]}</th>`;
    }
    document.getElementById('dateHeader').innerHTML = header;
    document.getElementById('memberList').innerHTML = "";
    const saved = localStorage.getItem('shiftData');
    (saved ? JSON.parse(saved) : defaultMembers).forEach(m => addRow(m));
    updateSummary();
}

function toggleSelectAll(mainCb) {
    document.querySelectorAll('.row-cb').forEach(cb => cb.checked = mainCb.checked);
}

function addRow(pre = null) {
    const tr = document.createElement('tr');
    let catOpt = categories.map(c => `<option value="${c}" ${pre?.cat===c?'selected':''}>${c||'--'}</option>`).join('');
    let titleOpt = titles.map(t => `<option value="${t}" ${pre?.title===t?'selected':''}>${t}</option>`).join('');
    let html = `<td><input type="checkbox" class="row-cb"></td>
        <td><select class="m-cat">${catOpt}</select></td>
        <td><input type="text" class="m-name" value="${pre?.name||''}" style="width:55px"></td>
        <td><input type="text" class="m-id" value="${pre?.id||''}" style="width:50px"></td>
        <td><input type="text" class="m-phone" value="${pre?.phone||''}" style="width:85px"></td>
        <td><select class="m-title">${titleOpt}</select></td>
        <td><select class="m-type" onchange="updateSummary()"><option value="正職" ${pre?.type==='正職'?'selected':''}>正職</option><option value="PT" ${pre?.type==='PT'?'selected':''}>PT</option><option value="駐場" ${pre?.type==='駐場'?'selected':''}>駐場</option></select></td>
        <td class="m-stat" style="font-size:10px">--</td>`;
    for(let i=0; i<28; i++) {
        const v = pre?.days?.[i] || 'W';
        html += `<td><select class="d-status status-${v}" onchange="changeStatus(this, ${i})">
            <option value="W" ${v==='W'?'selected':''}>上班</option><option value="L" ${v==='L'?'selected':''}>例假</option>
            <option value="H" ${v==='H'?'selected':''}>休假</option><option value="N" ${v==='N'?'selected':''}>國定</option>
            <option value="S" ${v==='S'?'selected':''}>特休</option><option value="D" ${v==='D'?'selected':''}>值星</option>
            <option value="C" ${v==='C'?'selected':''}>上課</option></select></td>`;
    }
    tr.innerHTML = html;
    document.getElementById('memberList').appendChild(tr);
}

function changeStatus(el, dayIdx) {
    el.className = 'd-status status-' + el.value;
    const name = el.closest('tr').querySelector('.m-name').value;
    const editor = document.getElementById('editorId').value;
    const log = `[${new Date().toLocaleTimeString()}] ${editor} 修改 ${name} 第 ${dayIdx+1} 天為 ${el.options[el.selectedIndex].text}`;
    document.getElementById('logList').insertAdjacentHTML('afterbegin', `<div>${log}</div>`);
    updateSummary();
}

function deleteSelectedRows() {
    const editor = document.getElementById('editorId').value;
    if (!editor) { alert("請先輸入薪號。"); return; }
    const selected = document.querySelectorAll('.row-cb:checked');
    if (selected.length === 0) { alert("請先勾選要刪除的人員。"); return; }
    if (confirm(`確定要刪除選中的 ${selected.length} 位人員嗎？`)) {
        selected.forEach(cb => cb.closest('tr').remove());
        updateSummary();
        document.getElementById('logList').insertAdjacentHTML('afterbegin', `<div style="color:red">[${new Date().toLocaleTimeString()}] ${editor} 批量刪除了人員</div>`);
    }
}

function autoDistributeHolidays() {
    const editor = document.getElementById('editorId').value;
    if (!editor) { alert("請先輸入薪號。"); return; }
    const selectedRows = Array.from(document.querySelectorAll('.row-cb:checked')).map(cb => cb.closest('tr'));
    if (selectedRows.length === 0) { alert("請先勾選要分配的人員。"); return; }
    
    if (!confirm(`將針對選中的 ${selectedRows.length} 位正職人員執行雙週例假優先分配。確定執行？`)) return;

    const rL = parseInt(document.getElementById('ruleL').value) || 0;
    const rH = parseInt(document.getElementById('ruleH').value) || 0;
    const rN = parseInt(document.getElementById('ruleN').value) || 0;

    selectedRows.forEach(row => {
        if (row.querySelector('.m-type').value !== '正職') return;
        const selects = Array.from(row.querySelectorAll('.d-status'));
        const holidayIndices = selects.map((s, i) => (!['W', 'D', 'C'].includes(s.value)) ? i : -1).filter(i => i !== -1);
        
        let assignedL = 0, assignedH = 0, assignedN = 0;
        let biweek1L = 0, biweek2L = 0;

        holidayIndices.forEach(idx => {
            if (idx < 14) {
                if (biweek1L < 2 && assignedL < rL) { selects[idx].value = 'L'; assignedL++; biweek1L++; }
            } else {
                if (biweek2L < 2 && assignedL < rL) { selects[idx].value = 'L'; assignedL++; biweek2L++; }
            }
        });

        holidayIndices.forEach(idx => {
            const sel = selects[idx];
            if (sel.value !== 'L' || (idx < 14 ? biweek1L : biweek2L) > 2 || assignedL > rL) {
                if (assignedL < rL) { sel.value = 'L'; assignedL++; }
                else if (assignedH < rH) { sel.value = 'H'; assignedH++; }
                else if (assignedN < rN) { sel.value = 'N'; assignedN++; }
                else { sel.value = 'S'; }
            }
            sel.className = 'd-status status-' + sel.value;
        });
    });
    updateSummary();
    alert("批量分配完成！");
}

function resetAllShifts() {
    const editor = document.getElementById('editorId').value;
    if (!editor) { alert("請先輸入薪號。"); return; }
    if (confirm("確定重置所有班表為上班 (W)？")) {
        document.querySelectorAll('.d-status').forEach(s => { s.value = 'W'; s.className = 'd-status status-W'; });
        updateSummary();
    }
}

function updateSummary() {
    const rows = document.querySelectorAll('#memberList tr');
    let proS = new Array(28).fill(0), fullS = new Array(28).fill(0);
    rows.forEach(r => {
        let l=0, h=0, n=0, s=0, type = r.querySelector('.m-type').value;
        r.querySelectorAll('.d-status').forEach((sel, i) => {
            const v = sel.value;
            if(v==='L') l++; if(v==='H') h++; if(v==='N') n++; if(v==='S') s++;
            if(['W','D'].includes(v)) { fullS[i]++; if(type==='正職') proS[i]++; }
        });
        r.querySelector('.m-stat').innerHTML = `例:${l} 休:${h}<br>國:${n} 特:${s}`;
    });
    let foot = `<tr class="summary-row summary-pro"><td colspan="8" class="pro-staff">正職人力</td>`;
    proS.forEach(n => foot += `<td class="pro-staff">${n}</td>`);
    foot += `</tr><tr class="summary-row summary-full"><td colspan="8" class="full-staff">全店人力</td>`;
    fullS.forEach(n => foot += `<td class="full-staff">${n}</td>`);
    document.getElementById('statFoot').innerHTML = foot;
}

function saveToLocal() {
    const data = Array.from(document.querySelectorAll('#memberList tr')).map(tr => ({
        cat: tr.querySelector('.m-cat').value, name: tr.querySelector('.m-name').value, id: tr.querySelector('.m-id').value, phone: tr.querySelector('.m-phone').value,
        title: tr.querySelector('.m-title').value, type: tr.querySelector('.m-type').value, days: Array.from(tr.querySelectorAll('.d-status')).map(s => s.value)
    }));
    localStorage.setItem('shiftData', JSON.stringify(data)); alert("儲存成功！");
}

function exportToExcel() {
    const tableClone = document.getElementById('mainTable').cloneNode(true);
    tableClone.querySelectorAll('tr').forEach(r => r.deleteCell(0));
    tableClone.querySelectorAll('tfoot tr').forEach(row => {
        const titleCell = row.querySelector('td[colspan="8"]');
        if (titleCell) {
            const titleText = titleCell.innerText;
            titleCell.remove();
            for (let i = 0; i < 6; i++) row.insertCell(0).innerText = "";
            row.insertCell(6).innerText = titleText;
        }
    });
    const originalRows = document.querySelectorAll('#memberList tr');
    tableClone.querySelectorAll('tbody tr').forEach((row, rIdx) => {
        const orig = originalRows[rIdx];
        row.querySelectorAll('input').forEach(inp => inp.parentElement.innerText = inp.value);
        const origSels = orig.querySelectorAll('select');
        row.querySelectorAll('select').forEach((sel, sIdx) => sel.parentElement.innerText = origSels[sIdx].options[origSels[sIdx].selectedIndex].text);
    });
    const wb = XLSX.utils.table_to_book(tableClone);
    XLSX.writeFile(wb, `排班表_${document.getElementById('startDate').value}.xlsx`);
}

window.onload = initTable;
</script>
</body>
</html>
